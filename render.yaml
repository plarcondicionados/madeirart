# Blueprint do Render — https://render.com/docs/blueprint-spec
#
# Com este arquivo no repositório, o Render configura o site sozinho:
# basta criar um Blueprint apontando para este repo (New + → Blueprint).
services:
  - type: web
    name: madeirart
    runtime: static
    # `npm ci` respeita o package-lock.json e garante build reproduzível.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false

    headers:
      # Os assets do Vite têm hash no nome, então podem ser cacheados para sempre.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    routes:
      # Landing page única: qualquer rota desconhecida cai no index.html.
      - type: rewrite
        source: /*
        destination: /index.html
